<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月白 · 2D 拆件绑骨打样 v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #070b18; color: #dfe7ff; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 55% at 50% 108%, rgba(64,110,190,.38), rgba(64,110,190,0) 60%),
      radial-gradient(circle at 78% 16%, rgba(240,246,255,.95) 0 34px, rgba(200,220,255,.35) 60px, rgba(200,220,255,0) 130px),
      linear-gradient(180deg, #060a1a 0%, #0a1230 55%, #0d1a3d 78%, #081126 100%);
  }
  .stars { position: absolute; inset: 0; opacity: .8; }
  .stars i { position: absolute; border-radius: 50%; background: #cfe0ff; animation: tw 3.4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: .95 } }
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 17%;
    background: linear-gradient(180deg, rgba(90,140,230,.12), rgba(40,80,170,.22));
    border-top: 1px solid rgba(160,200,255,.16);
  }
  .fig-wrap {
    position: absolute; left: 50%; bottom: 4.5%; transform: translateX(-50%);
    height: min(86vh, 177vw); aspect-ratio: 1120 / 2240;
    filter: drop-shadow(0 18px 44px rgba(0,0,0,.55));
  }
  .figure { position: absolute; inset: 0; transform-origin: 50% 88%; will-change: transform; }
  .figure img.body { position: absolute; inset: 0; width: 100%; height: 100%; }
  .patch {
    position: absolute; will-change: transform, opacity;
    opacity: 0; transition: opacity .09s linear;
  }
  .patch.on { opacity: 1; }
  .foxfire {
    position: absolute; width: 11%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(190,230,255,.95) 0%, rgba(96,165,250,.65) 32%, rgba(59,110,246,.22) 62%, rgba(59,110,246,0) 72%);
    filter: blur(2px); mix-blend-mode: screen; pointer-events: none;
    animation: flick 2.6s ease-in-out infinite;
  }
  @keyframes flick {
    0%,100% { transform: scale(1) translateY(0); opacity: .85; }
    30% { transform: scale(1.13) translateY(-4%); opacity: 1; }
    55% { transform: scale(.92) translateY(2%); opacity: .7; }
    75% { transform: scale(1.07) translateY(-2%); opacity: .95; }
  }
  .panel {
    position: fixed; left: 18px; top: 18px; z-index: 5;
    background: rgba(10,16,36,.66); border: 1px solid rgba(150,180,255,.22);
    border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(8px); max-width: 300px;
  }
  .panel h1 { font-size: 16px; letter-spacing: .14em; font-weight: 600; color: #eef3ff; }
  .panel p { font-size: 12px; line-height: 1.7; color: #9db1dd; margin-top: 6px; }
  .btns { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; display: flex; gap: 10px; }
  .btns button {
    font: inherit; font-size: 13px; letter-spacing: .08em; cursor: pointer;
    color: #dfe7ff; background: rgba(16,26,54,.72); border: 1px solid rgba(150,180,255,.3);
    padding: 9px 18px; border-radius: 999px; backdrop-filter: blur(8px);
    transition: all .18s;
  }
  .btns button:hover { border-color: rgba(190,215,255,.75); color: #fff; }
  .btns button.act { background: #2b4a8f; border-color: #7ea6ff; color: #fff; }
  .params {
    position: fixed; right: 18px; top: 18px; z-index: 5; text-align: right;
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.9; color: #8fa8d8;
    background: rgba(10,16,36,.55); border: 1px solid rgba(150,180,255,.16);
    border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(8px);
  }
  .params b { color: #e6eeff; font-weight: 500; }
  .hint { position: fixed; right: 18px; bottom: 22px; z-index: 5; font-size: 12px; color: #7e93c4; }
</style>
</head>

<div class="panel">
  <h1>月白 · 拆件绑骨打样 v2</h1>
  <p>身体层自带脸（比例 1:1 原图），眨眼与说话只贴五官补丁：闭眼补丁、张口补丁，按实测眼距/嘴位锚点缩放对位、边缘羽化。呼吸、悬浮、跟随、眨眼、口型全部参数驱动。</p>
</div>

<div class="params" id="params"></div>

<div class="btns">
  <button data-mode="idle" class="act">常态</button>
  <button data-mode="talk">说话</button>
  <button data-mode="listen">聆听 · 闭眼</button>
</div>
<div class="hint">移动鼠标 / 手指 — 他会微微跟随</div>

<script>
const figure = document.getElementById('figure');
const pBlink = document.getElementById('p-blink');
const pTalk = document.getElementById('p-talk');
const paramsEl = document.getElementById('params');

(() => {
  const box = document.getElementById('stars');
  let html = '';
  for (let i = 0; i < 90; i++) {
    const s = (Math.random() * 1.8 + .7).toFixed(1);
    html += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 62).toFixed(1)}%;width:${s}px;height:${s}px;animation-delay:${(-Math.random() * 3.4).toFixed(1)}s"></i>`;
  }
  box.innerHTML = html;
})();

let mode = 'idle';
let px = 0, py = 0, hx = 0, hy = 0;
let blinkOn = false, talkFlip = false, lastTalk = 0;
addEventListener('pointermove', e => {
  px = (e.clientX / innerWidth) * 2 - 1;
  py = (e.clientY / innerHeight) * 2 - 1;
});
function scheduleBlink() {
  setTimeout(() => {
    if (mode === 'idle') {
      blinkOn = true; pBlink.classList.add('on');
      setTimeout(() => { blinkOn = false; if (mode === 'idle') pBlink.classList.remove('on'); }, 150);
    }
    scheduleBlink();
  }, 2600 + Math.random() * 3200);
}
scheduleBlink();

document.querySelectorAll('.btns button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.btns button').forEach(x => x.classList.remove('act'));
    b.classList.add('act');
    mode = b.dataset.mode;
    pTalk.classList.remove('on');
    if (mode === 'listen') pBlink.classList.add('on'); else if (mode === 'idle') pBlink.classList.remove('on');
  });
});
(() => {
  const m = new URLSearchParams(location.search).get('mode');
  if (m === 'talk' || m === 'listen') {
    document.querySelector(`.btns button[data-mode="${m}"]`)?.click();
    if (m === 'talk') pTalk.classList.add('on');
  }
})();

function frame(t) {
  const s = t / 1000;
  const breath = Math.sin(s * (Math.PI * 2 / 3.4));
  const bob = Math.sin(s * (Math.PI * 2 / 6.2));
  hx += (px - hx) * .045; hy += (py - hy) * .045;
  figure.style.transform =
    `translateY(${(bob * 7).toFixed(2)}px) rotate(${(hx * .8).toFixed(2)}deg) scale(1, ${(1 + breath * .0045).toFixed(5)})`;
  const faceShift = `translate(${(hx * 3.5).toFixed(2)}px, ${(hy * 2.2 + breath * .5).toFixed(2)}px)`;
  pBlink.style.transform = faceShift;
  pTalk.style.transform = faceShift;
  if (mode === 'talk' && t - lastTalk > 165) {
    lastTalk = t; talkFlip = !talkFlip;
    pTalk.classList.toggle('on', talkFlip);
  }
  paramsEl.innerHTML =
    `ParamAngleX <b>${(hx * 30).toFixed(1)}</b><br>` +
    `ParamAngleY <b>${(hy * 22).toFixed(1)}</b><br>` +
    `ParamBreath <b>${((breath + 1) / 2).toFixed(2)}</b><br>` +
    `ParamBodyY <b>${(bob * 5).toFixed(1)}</b><br>` +
    `Blink <b>${pBlink.classList.contains('on') ? 1 : 0}</b> · Mouth <b>${pTalk.classList.contains('on') ? 'open' : 'shut'}</b>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
